<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR - Vídeo na Track</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        /* =================================================
           BOTÃO DO VÍDEO
        ================================================= */

        #btnIniciar {

            position: fixed;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            display: none;

            padding: 15px 30px;

            border: none;

            border-radius: 30px;

            background: white;

            color: black;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        #btnIniciar:active {

            transform: translateX(-50%) scale(0.95);

        }


        /* =================================================
           MENSAGEM
        ================================================= */

        #mensagem {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            padding: 10px 20px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            font-size: 15px;

            text-align: center;

        }

    </style>

</head>


<body>


    <!-- =================================================
         MENSAGEM
    ================================================= -->

    <div id="mensagem">

        Aponte a câmera para a imagem

    </div>


    <!-- =================================================
         BOTÃO INICIAR VÍDEO
    ================================================= -->

    <button id="btnIniciar">

        ▶ INICIAR VÍDEO

    </button>


    <!-- =================================================
         CENA A-FRAME
    ================================================= -->

    <a-scene

        id="cena"

        mindar-image="imageTargetSrc: Imagens/targets.mind;"

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false">


        <!-- =================================================
             ASSETS
        ================================================= -->

        <a-assets>

            <video  id="videoAR" src="videos/video.mp4"  preload="auto" playsinline  webkit-playsinline crossorigin="anonymous"></video>

        </a-assets>


        <!-- =================================================
             CÂMERA
        ================================================= -->

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>


        <!-- =================================================
             TRACK
        ================================================= -->

        <a-entity id="track" mindar-image-target="targetIndex: 0">           

            <a-video id="videoPlane" src="#videoAR" position="0 0 0.01"  rotation="0 0 0"  width="1" height="1.5" material="shader: flat; side: double;"  visible="false"></a-video>

        </a-entity>


    </a-scene>


    <!-- =================================================
         JAVASCRIPT
    ================================================= -->
  <script src="main.js"></script>
    
</body>
</html>
