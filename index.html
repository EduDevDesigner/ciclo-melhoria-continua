<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR - Vídeo na Track</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        /* =================================================
           BOTÃO DO VÍDEO
        ================================================= */

        #btnIniciar {

            position: fixed;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            display: none;

            padding: 15px 30px;

            border: none;

            border-radius: 30px;

            background: white;

            color: black;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        #btnIniciar:active {

            transform: translateX(-50%) scale(0.95);

        }


        /* =================================================
           MENSAGEM
        ================================================= */

        #mensagem {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            padding: 10px 20px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            font-size: 15px;

            text-align: center;

        }

    </style>

</head>


<body>


    <!-- =================================================
         MENSAGEM
    ================================================= -->

    <div id="mensagem">

        Aponte a câmera para a imagem

    </div>


    <!-- =================================================
         BOTÃO INICIAR VÍDEO
    ================================================= -->

    <button id="btnIniciar">

        ▶ INICIAR VÍDEO

    </button>


    <!-- =================================================
         CENA A-FRAME
    ================================================= -->

    <a-scene

        id="cena"

        mindar-image="imageTargetSrc: Imagens/targets.mind;"

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false">


        <!-- =================================================
             ASSETS
        ================================================= -->

        <a-assets>

            <video  id="videoAR" src="videos/video.mp4"  preload="auto" playsinline  webkit-playsinline crossorigin="anonymous"></video>

        </a-assets>


        <!-- =================================================
             CÂMERA
        ================================================= -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>


        <!-- =================================================
             TRACK
        ================================================= -->

        <a-entity

            id="track"

            mindar-image-target="targetIndex: 0">


            <!-- =================================================
                 VÍDEO
            ================================================= -->

            <a-video

                id="videoPlane"

                src="#videoAR"

                position="0 0 0.01"

                rotation="0 0 0"

                width="1"

                height="1.5"

                material="shader: flat; side: double;"

                visible="false">

            </a-video>


        </a-entity>


    </a-scene>


    <!-- =================================================
         JAVASCRIPT
    ================================================= -->

    <script>


        // ====================================================
        // ELEMENTOS
        // ====================================================

        const cena =
            document.querySelector("#cena");


        const track =
            document.querySelector("#track");


        const video =
            document.querySelector("#videoAR");


        const videoPlane =
            document.querySelector("#videoPlane");


        const btnIniciar =
            document.querySelector("#btnIniciar");


        const mensagem =
            document.querySelector("#mensagem");


        // ====================================================
        // ESTADO
        // ====================================================

        let experienciaIniciada = false;

        let trackEncontrada = false;

        let videoIniciado = false;


        // ====================================================
        // CENA CARREGADA
        // ====================================================

        cena.addEventListener(
            "loaded",
            function () {

                console.log(
                    "A-Frame carregado."
                );

            }
        );


        // ====================================================
        // BOTÃO INICIAR VÍDEO
        // ====================================================

        btnIniciar.addEventListener(
            "click",
            function () {

                console.log(
                    "Botão iniciar vídeo pressionado."
                );


                // =============================================
                // MARCA QUE O USUÁRIO INICIOU O VÍDEO
                // =============================================

                videoIniciado = true;


                // =============================================
                // REPRODUZ O VÍDEO
                // =============================================

                video.play()
                    .then(function () {

                        console.log(
                            "Vídeo iniciado."
                        );

                    })
                    .catch(function (erro) {

                        console.warn(
                            "Erro ao iniciar vídeo:",
                            erro
                        );

                    });


                // =============================================
                // ESCONDE O BOTÃO
                // =============================================

                btnIniciar.style.display =
                    "none";


                mensagem.innerHTML =
                    "Vídeo reproduzindo";


            }
        );


        // ====================================================
        // TRACK ENCONTRADA
        // ====================================================

        track.addEventListener(
            "targetFound",
            function () {

                console.log(
                    "================================"
                );

                console.log(
                    "TRACK ENCONTRADA!"
                );

                console.log(
                    "================================"
                );


                trackEncontrada = true;


                // =============================================
                // MOSTRA VÍDEO
                // =============================================

                videoPlane.setAttribute(
                    "visible",
                    "true"
                );


                // =============================================
                // POSIÇÃO
                // =============================================

                videoPlane.setAttribute(
                    "position",
                    "0 0 0.01"
                );


                // =============================================
                // SE O VÍDEO JÁ FOI INICIADO PELO USUÁRIO
                // =============================================

                if (videoIniciado) {


                    console.log(
                        "Continuando vídeo."
                    );


                    // Continua exatamente
                    // do ponto em que parou

                    video.play()
                        .then(function () {

                            console.log(
                                "Vídeo continuando."
                            );

                        })
                        .catch(function (erro) {

                            console.warn(
                                "Não foi possível continuar:",
                                erro
                            );

                        });


                    mensagem.innerHTML =
                        "Vídeo reproduzindo";


                }

                else {


                    // =========================================
                    // PRIMEIRA VEZ QUE A TRACK É ENCONTRADA
                    // =========================================

                    console.log(
                        "Aguardando usuário iniciar o vídeo."
                    );


                    // O vídeo fica pausado

                    video.pause();


                    // Mostra o botão

                    btnIniciar.style.display =
                        "block";


                    mensagem.innerHTML =
                        "Track reconhecida";


                }

            }
        );


        // ====================================================
        // TRACK PERDIDA
        // ====================================================

        track.addEventListener(
            "targetLost",
            function () {

                console.log(
                    "================================"
                );

                console.log(
                    "TRACK PERDIDA!"
                );

                console.log(
                    "================================"
                );


                trackEncontrada = false;


                // =============================================
                // ESCONDE VÍDEO
                // =============================================

                videoPlane.setAttribute(
                    "visible",
                    "false"
                );


                // =============================================
                // PAUSA O VÍDEO
                // =============================================

                video.pause();


                // =============================================
                // NÃO ALTERAMOS video.currentTime
                // =============================================
                //
                // Isso é MUITO importante.
                //
                // O vídeo permanece exatamente no ponto
                // onde estava quando a track foi perdida.
                //
                // =============================================


                // =============================================
                // ESCONDE O BOTÃO
                // =============================================

                btnIniciar.style.display =
                    "none";


                mensagem.innerHTML =
                    "Aponte a câmera para a imagem";


            }
        );


        // ====================================================
        // VÍDEO TERMINOU
        // ====================================================

        video.addEventListener(
            "ended",
            function () {

                console.log(
                    "Vídeo terminou."
                );


                // =============================================
                // MARCA COMO NÃO INICIADO
                // =============================================

                videoIniciado = false;


                // =============================================
                // SE A TRACK AINDA ESTIVER PRESENTE
                // MOSTRA O BOTÃO NOVAMENTE
                // =============================================

                if (trackEncontrada) {

                    btnIniciar.style.display =
                        "block";


                    mensagem.innerHTML =
                        "Vídeo finalizado";

                }

            }
        );


        // ====================================================
        // ERRO NO VÍDEO
        // ====================================================

        video.addEventListener(
            "error",
            function (erro) {

                console.error(
                    "Erro no vídeo:",
                    erro
                );


                mensagem.innerHTML =
                    "Erro ao carregar o vídeo.";

            }
        );


    </script>


</body>

</html>
