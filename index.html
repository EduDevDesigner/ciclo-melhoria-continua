<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AR - Vídeo na Track</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>
<body>
    <!-- =================================================
         MENSAGEM
    ================================================= -->

    <div id="mensagem">

        Aponte a câmera para a imagem

    </div>
    <!-- =================================================
         BOTÃO INICIAR VÍDEO
    ================================================= -->

    <button id="btnIniciar">▶ INICIAR VÍDEO</button>

    <!-- =================================================
         CENA A-FRAME
    ================================================= -->
    <a-scene

        id="cena"
        mindar-image="imageTargetSrc: Imagens/targets.mind;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        xr-mode-ui="enabled:false"
        device-orientation-permission-ui="enabled: false">

        <!-- =================================================
             ASSETS
        ================================================= -->

        <a-assets>

            <video  id="videoAR" src="videos/video.mp4"  preload="auto" playsinline  webkit-playsinline crossorigin="anonymous"></video>

        </a-assets>

        <!-- =================================================
             CÂMERA
        ================================================= -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- =================================================
             TRACK
        ================================================= -->
        <a-entity id="track" mindar-image-target="targetIndex: 0">           

            <a-video id="videoPlane" src="#videoAR" position="0 0 0.01"  rotation="0 0 0"  width="1" height="1.5" material="shader: flat; side: double;"  visible="false"></a-video>

        </a-entity>

    </a-scene>

    <!-- =================================================
         JAVASCRIPT
    ================================================= -->
  <script src="main.js"></script>
    
</body>
</html>
